# default - sample recipe that ships with docker2wsl: a general dev box from stock Ubuntu with the
# public straps only, so it builds anywhere (no keys, no employer tooling). Copy it into a private
# overlay's recipes/ folder to change it; a recipe there with the same name replaces this one.
#   container2wsl.bat --recipe default -n mydev -u alice      WSL distro (Windows)
#   container2wsl.bat --recipe default --target container     container (Windows, docker/podman)
#   ./container2x.sh --recipe default -n mydev                container (macOS / Linux)
# Add -p ssh-keys -p keychain once a private overlay has an ssh/ folder, and -p claude for Claude Code.
# No name= or user=: the build is named "default" and the user "wsluser" unless -n / -u say otherwise.
image=docker.io/library/ubuntu:24.04
name=vbox
user=v-user
bootstraps=sudo devtools zsh motd k8s-tools data-tools
poststraps=powerlevel10k uv devtools-shell devtools-overlay
